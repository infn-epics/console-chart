# epics-console-chart/values.yaml
image:
  repository: baltig.infn.it:4567/epics-containers/epics-docker-console
  tag: 2024.3.7-4.7.4
  imagePullPolicy: Always


replicaCount: 1
route:
  enabled: true ## enable the route (for openshift)
  host: apps.okd-datest.lnf.infn.it ## host name namespace

opi:
  exec: start.sh
  claim: ## an existing claim
  init: true
  url: https://baltig.infn.it/lnf-da-control/sparc-epics-opi.git
  path: .
  branch: main

serviceAccountName: default

securityContext:
    privileged: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

# The following are ReadWriteMany PVCs that are shared
# if not specified a claim ReadWriteOnce is created for each

# use the shared PVC autosave files (comment out for no autosave)
autosaveClaim:
# use the shared PVC to share data
dataClaim:
beamline:
configCA:
  existingConfigMap: "" # name of existing configMap that set CA parameters
  address_list: ""
  max_array_bytes: "10000000"

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: console.apps.okd-datest.lnf.infn.it
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
