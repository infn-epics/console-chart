# epics-console-chart/values.yaml
image:
  repository: ghcr.io/infn-epics/nox-ubuntu-console
  tag: latest
  imagePullPolicy: Always


replicaCount: 1
route:
  enabled: true ## enable the route (for openshift)
  host:  ## host name namespace

gitRepoConfig:
  exec: start.sh
  claim: ## an existing claim
  init: true
  url: https://baltig.infn.it/lnf-da-control/sparc-epics-opi.git
  path: .
  branch: main
  ansiblePlaybook: configure-epics-consoles.yml  ## Ansible playbook to run for console configuration

opimain: ### name of the bob to launch 
serviceAccountName: default

securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

# The following are ReadWriteMany PVCs that are shared
# if not specified a claim ReadWriteOnce is created for each

# use the shared PVC autosave files (comment out for no autosave)
autosaveClaim:
# use the shared PVC to share data
dataClaim:
beamline:

epicsConfiguration:
  name:    ## load the epicsConfigurationMap
  gateway: ## if defined EPICS_CA_ADDR_LIST is overridden

resources: {}

staticIP:

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: 
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

