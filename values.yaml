# epics-console-chart/values.yaml
image:
  repository: baltig.infn.it:4567/epics-containers/epics-docker-console
  tag: latest
  imagePullPolicy: Always



route:
  enabled: true ## enable the route (for openshift)
  host: apps.okd-datest.lnf.infn.it ## host name namespace

opi:
  exec: start.sh
  claim: ## an existing claim
  init: true
  url: https://baltig.infn.it/lnf-da-control/sparc-epics-opi.git
  path: .
  branch: main
serviceAccountName: default
securityContext:
            privileged: true

# The following are ReadWriteMany PVCs that are shared
# if not specified a claim ReadWriteOnce is created for each

# use the shared PVC autosave files (comment out for no autosave)
autosaveClaim:
# use the shared PVC to share data
dataClaim:
