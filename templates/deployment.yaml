apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "epics-console-chart.release" . }}
  labels:
    app.kubernetes.io/name: {{ include "epics-console-chart.name" . }}
    app.kubernetes.io/instance: {{ include "epics-console-chart.release" . }}

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "epics-console-chart.name" . }}
      app.kubernetes.io/instance: {{ include "epics-console-chart.release" . }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "epics-console-chart.name" . }}
        app.kubernetes.io/instance: {{ include "epics-console-chart.release" . }}

    spec:
      {{ if ne .Values.serviceAccountName "" }}
      serviceAccountName: {{ .Values.serviceAccountName | quote }}
      {{ end }}
      hostNetwork: {{ .Values.hostNetwork | quote }}
    {{ if .Values.opi.init }}
      initContainers:
      - name: init-volume
        image: alpine:latest
        command: 
        - sh 
        - -c
        - |
          apk --no-cache add git
        
          rm -rf /tmp/*
          if [ -n "{{ .Values.opi.branch }}" ];then
            git clone -b {{ .Values.opi.branch }} {{ .Values.opi.url }} --recurse-submodules temp-config
          else
            git clone {{ .Values.opi.url }} --recurse-submodules temp-config
          fi

          if [ -d temp-config/{{ .Values.opi.path}} ];then
            if [ "{{ .Values.opi.path }}" == "." ];then
                mv temp-config/ /tmp/opi
            else
              mv temp-config/{{ .Values.opi.path}} /tmp/opi
              rm -rf temp-config
            fi
          else
            mv temp-config /tmp/opi
          fi

          chmod a+w,a+r -R /tmp
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: opis-volume
          mountPath: /tmp
    {{ end }}

      containers:
        - name: epics-console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}

          ports:
            - containerPort: 80
            - containerPort: 5900
          securityContext:
            privileged: true
          env:
          - name: OPIHOME
            value: /phoebus/interface/opi
          - name: OPISTART
            value: {{ .Values.opi.exec | quote }}
  
          {{ if .Values.env  }}
          {{- range $envVar := .Values.env }}
          - name: {{ $envVar.name }}
            value: {{ $envVar.value | quote }}
          {{- end }}
          {{- end }}
          volumeMounts:
          - name: x11-socket
            mountPath: /tmp/.X11-unix
          - name: opis-volume
            mountPath: /phoebus/interface
      volumes:
        - name: x11-socket
          hostPath:
            path: /tmp/.X11-unix
        {{- if .Values.opi.claim }}
        - name: opis-volume
          persistentVolumeClaim:
            claimName: {{ .Values.opi.claim }}
        {{- else }}
        - name: opis-volume
          persistentVolumeClaim:
            claimName: {{ include "epics-console-chart.release" . }}-pvc
        {{- end }}
