apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "epics-console-chart.release" . }}
  labels:
    app.kubernetes.io/name: {{ include "epics-console-chart.name" . }}
    app.kubernetes.io/instance: {{ include "epics-console-chart.release" . }}
    beamline: {{ .Values.beamline | quote }}
spec:
  serviceName: "{{ .Values.serviceName }}"
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "epics-console-chart.name" . }}
      app.kubernetes.io/instance: {{ include "epics-console-chart.release" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "epics-console-chart.name" . }}
        app.kubernetes.io/instance: {{ include "epics-console-chart.release" . }}
    spec:
      {{ if .Values.serviceAccountName }}
      serviceAccountName: {{ .Values.serviceAccountName | quote }}
      {{ end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      hostNetwork: {{ .Values.hostNetwork | quote }}
      initContainers:
      - name: init-volume
        image: baltig.infn.it:4567/epics-containers/container-init
        command:
        - sh
        - -c
        - |
          rm -rf /tmp/*
          cd /tmp
          echo "repository {{ .Values.gitRepoConfig.url }} branch {{ .Values.gitRepoConfig.branch }}"
          if [ -n "{{ .Values.gitRepoConfig.token }}" ]; then
            echo "Cloning repository using Personal Access Token"
            if [ -n "{{ .Values.gitRepoConfig.branch }}" ]; then
              git clone -b {{ .Values.gitRepoConfig.branch }} https://oauth2:{{ .Values.gitRepoConfig.token }}@{{ .Values.gitRepoConfig.url | replace "https://" "" }} --recurse-submodules opi-repo
            else
              git clone https://oauth2:{{ .Values.gitRepoConfig.token }}@{{ .Values.gitRepoConfig.url | replace "https://" "" }} --recurse-submodules beamline-repo
            fi
          else

            if [ -n "{{ .Values.gitRepoConfig.branch }}" ]; then
              git clone -b {{ .Values.gitRepoConfig.branch }} {{ .Values.gitRepoConfig.url }} --recurse-submodules beamline-repo
            else
              git clone {{ .Values.gitRepoConfig.url }} --recurse-submodules beamline-repo
            fi
          fi

          mkdir -p /data/opi /autosave/opi
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: opis-volume
          mountPath: /tmp
        - name: autosave-volume
          mountPath: /autosave
        - name: data-volume
          mountPath: /data
      containers:
        - name: epics-console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          ports:
            - containerPort: 80
            - containerPort: 5900
          
          {{- if .Values.epicsConfiguration.name }}
          envFrom:
            - configMapRef:
                name: {{ .Values.epicsConfiguration.name }}
          {{- end }}
            
          env:
            - name: OPIHOME
              value: /phoebus/opi/beamline-repo/opi
            - name: OPIDATA
              value: /data/opi
            - name: OPISTART
              value: {{ .Values.gitRepoConfig.exec | quote }}
            {{- if .Values.epicsConfiguration.name }}
            - name: PHOEBUSINI
              value: /phoebus/phoebus_settings.ini
            {{- end}}
            {{- if .Values.opimain }}
            - name: OPIMAIN
              value: {{.Values.opimain}}
            {{- end}}
  
            {{- if .Values.epicsConfiguration.gateway }}
            - name: EPICS_CA_ADDR_LIST
              value: {{ .Values.epicsConfiguration.gateway | quote }}
            - name: EPICS_CA_AUTO_ADDR_LIST
              value: "NO"
            {{- end }}
            {{ if .Values.env }}
            {{- range $envVar := .Values.env }}
            - name: {{ $envVar.name }}
              value: {{ $envVar.value | quote }}
            {{- end }}
            {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12}}
          volumeMounts:
            - name: opis-volume
              mountPath: /phoebus/opi
            - name: autosave-volume
              mountPath: /autosave
            - name: data-volume
              mountPath: /data
{{- if .Values.epicsConfiguration.name }}
            - name: epicsconfig-volume
              mountPath: /phoebus/phoebus_settings.ini
              subPath: phoebus_settings.ini  # Specify the filename you want to mount
      volumes:
        - name: epicsconfig-volume
          configMap:
            name: {{ .Values.epicsConfiguration.name }}
        - name: opis-volume
          emptyDir: {}
{{- end }}
  volumeClaimTemplates:
    
    - metadata:
        name: autosave-volume
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: data-volume
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
