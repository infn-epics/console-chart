apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "epics-console-chart.release" . }}
  labels:
    app.kubernetes.io/name: {{ include "epics-console-chart.name" . }}
    app.kubernetes.io/instance: {{ include "epics-console-chart.release" . }}
    beamline: {{ .Values.beamline | quote }}
spec:
  serviceName: "{{ .Values.serviceName }}"
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "epics-console-chart.name" . }}
      app.kubernetes.io/instance: {{ include "epics-console-chart.release" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "epics-console-chart.name" . }}
        app.kubernetes.io/instance: {{ include "epics-console-chart.release" . }}
    spec:
      {{ if .Values.serviceAccountName }}
      serviceAccountName: {{ .Values.serviceAccountName | quote }}
      {{ end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      hostNetwork: {{ .Values.hostNetwork | quote }}
      initContainers:
      - name: init-console
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.imagePullPolicy }}
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        {{- if .Values.epicsConfiguration.name }}
        envFrom:
          - configMapRef:
              name: {{ .Values.epicsConfiguration.name }}
        {{- end }}
        env:
          {{- if .Values.epicsConfiguration.name }}
          - name: PHOEBUSINI
            value: /phoebus/phoebus_settings.ini
          {{- end }}
        command:
        - sh
        - -c
        - |
          set -e
          echo "=== Initializing EPICS Console - Git Clone ==="
          cd /phoebus
          {{- if .Values.git_credentials_secret }}
          # Per-URL-prefix tokens (gitconfig key of the git_credentials_secret Secret); ignored by git if absent
          git config --global include.path /etc/git-credentials/gitconfig
          {{- end }}
          
          echo "Cloning repository {{ .Values.gitRepoConfig.url }} branch {{ .Values.gitRepoConfig.branch }}"
          if [ -n "{{ .Values.gitRepoConfig.token }}" ]; then
            echo "Using Personal Access Token"
            if [ -n "{{ .Values.gitRepoConfig.branch }}" ]; then
              git clone -b {{ .Values.gitRepoConfig.branch }} https://oauth2:{{ .Values.gitRepoConfig.token }}@{{ .Values.gitRepoConfig.url | replace "https://" "" }} --recurse-submodules beamline-repo
            else
              git clone https://oauth2:{{ .Values.gitRepoConfig.token }}@{{ .Values.gitRepoConfig.url | replace "https://" "" }} --recurse-submodules beamline-repo
            fi
          else
            if [ -n "{{ .Values.gitRepoConfig.branch }}" ]; then
              git clone -b {{ .Values.gitRepoConfig.branch }} {{ .Values.gitRepoConfig.url }} --recurse-submodules beamline-repo
            else
              git clone {{ .Values.gitRepoConfig.url }} --recurse-submodules beamline-repo
            fi
          fi

          # Create data directories
          mkdir -p /data/opi /autosave/opi
          
          echo "=== Git clone complete ==="
        volumeMounts:
        - name: phoebus-volume
          mountPath: /phoebus
        - name: autosave-volume
          mountPath: /autosave
        - name: data-volume
          mountPath: /data
        {{- if .Values.git_credentials_secret }}
        - name: git-credentials
          mountPath: /etc/git-credentials
          readOnly: true
        {{- end }}
        {{- if .Values.epicsConfiguration.name }}
        - name: phoebus-ini
          mountPath: /phoebus/phoebus_settings.ini
          subPath: phoebus_settings.ini
        {{- end }}
      containers:
        - name: epics-console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          ports:
            - containerPort: 80
            - containerPort: 5900
          
          {{- if .Values.epicsConfiguration.name }}
          envFrom:
            - configMapRef:
                name: {{ .Values.epicsConfiguration.name }}
          {{- end }}
            
          env:
            - name: OPIHOME
              value: /phoebus/beamline-repo/opi
            - name: OPIDATA
              value: /data/opi
            - name: OPISTART
              value: {{ .Values.gitRepoConfig.exec | quote }}
            {{- if .Values.gitRepoConfig.ansiblePlaybook }}
            - name: ANSIBLE_PLAYBOOK
              value: {{ .Values.gitRepoConfig.ansiblePlaybook | quote }}
            - name: ANSIBLE_DIR
              value: /phoebus/beamline-repo/opi/ansible
            {{- end }}
            {{- if .Values.epicsConfiguration.name }}
            - name: PHOEBUSINI
              value: /phoebus/phoebus_settings.ini
            {{- end}}
            {{- if .Values.opimain }}
            - name: OPIMAIN
              value: {{.Values.opimain}}
            {{- end}}
  
            {{- if .Values.epicsConfiguration.gateway }}
            - name: EPICS_CA_ADDR_LIST
              value: {{ .Values.epicsConfiguration.gateway | quote }}
            - name: EPICS_CA_AUTO_ADDR_LIST
              value: "NO"
            {{- end }}
            {{- if .Values.env }}
            {{- range $envVar := .Values.env }}
            - name: {{ $envVar.name }}
              value: {{ $envVar.value | quote }}
            {{- end }}
            {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12}}
          volumeMounts:
            - name: phoebus-volume
              mountPath: /phoebus
            - name: autosave-volume
              mountPath: /autosave
            - name: data-volume
              mountPath: /data
            {{- if .Values.epicsConfiguration.name }}
            - name: phoebus-ini
              mountPath: /phoebus/phoebus_settings.ini
              subPath: phoebus_settings.ini
            {{- end }}
      volumes:
        - name: phoebus-volume
          emptyDir: {}
        {{- if .Values.git_credentials_secret }}
        - name: git-credentials
          secret:
            secretName: {{ .Values.git_credentials_secret | quote }}
            optional: true
            defaultMode: 0444
        {{- end }}
        {{- if .Values.epicsConfiguration.name }}
        - name: phoebus-ini
          configMap:
            name: {{ .Values.epicsConfiguration.name }}
            items:
            - key: phoebus_settings.ini
              path: phoebus_settings.ini
        {{- end }}
  volumeClaimTemplates:
    
    - metadata:
        name: autosave-volume
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: data-volume
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
