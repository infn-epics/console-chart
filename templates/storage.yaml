{{- if not .Values.opi.claim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "epics-console-chart.release" . }}-opi
  beamline: {{ .Values.beamline }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
{{- end }}

{{- if not .Values.autosaveClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "epics-console-chart.release" . }}-autosave
  beamline: {{ .Values.beamline }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
{{- end }}

{{- if not .Values.dataClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "epics-console-chart.release" . }}-data
  beamline: {{ .Values.beamline }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
{{- end }}