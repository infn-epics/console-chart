{{- if .Values.route.enabled -}}
{{- if .Values.route.host -}}
{{- $fullName := include "epics-console-chart.fullname" . -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $fullName }}
spec:
  host: {{ .Release.Name }}.{{ .Values.route.host }}
  to:
    kind: Service
    name: {{ $fullName }}
    weight: 100
  port:
    targetPort: 80
{{- end }}
{{- end }}
